[project]
name = "brain-mri-multimodal-rag"
version = "1.0.0"
description = "Explainable brain MRI classification with multimodal RAG (image + text retrieval) and a local LLM"
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["Notebooks", "tests"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E402",   # scripts call matplotlib.use("Agg") before other imports
    "E731",   # small lambdas are fine
    "E702",   # a few compact one-liners with ';'
    "E701",   # compact one-line plotting loops in the analysis scripts
    "E712",   # pandas masks like df.col == False are intentional
]

[tool.ruff.lint.per-file-ignores]
"Notebooks/04_hybrid_search.py" = ["E501"]   # labelled question table reads better unwrapped
"Notebooks/03_robustness.py" = ["E501"]
